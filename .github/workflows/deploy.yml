name: Deploy (Coolify)

# Runs only after the CI workflow finishes successfully on a push to main (production) or staging,
# and verifies that Malware Scan (CI Gate) has also succeeded on the same commit.
# Never deploys when either workflow fails or is skipped.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, staging]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.repository }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for Malware Scan (CI Gate)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          echo "Verifying Malware Scan (CI Gate) for commit $HEAD_SHA in $GH_REPO..."

          ELAPSED=0
          TIMEOUT=600
          while true; do
            STATUS=$(gh run list --repo "$GH_REPO" --commit "$HEAD_SHA" --branch "$HEAD_BRANCH" --event push --workflow "Malware Scan (CI Gate)" --json status,conclusion --jq '.[0] // empty')
            if [[ -n "$STATUS" ]]; then
              RUN_STATUS=$(echo "$STATUS" | jq -r '.status')
              RUN_CONCLUSION=$(echo "$STATUS" | jq -r '.conclusion')
              echo "Malware Scan status: $RUN_STATUS, conclusion: $RUN_CONCLUSION"

              if [[ "$RUN_STATUS" == "completed" ]]; then
                if [[ "$RUN_CONCLUSION" != "success" ]]; then
                  echo "Malware Scan (CI Gate) did not succeed (conclusion: $RUN_CONCLUSION). Aborting deployment."
                  exit 1
                fi
                echo "Malware Scan (CI Gate) succeeded!"
                break
              fi
            else
              echo "Waiting for Malware Scan (CI Gate) run to be registered..."
            fi

            if [[ $ELAPSED -ge $TIMEOUT ]]; then
              echo "Timed out waiting for Malware Scan (CI Gate)"
              exit 1
            fi

            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done

      - name: Trigger Coolify deployment
        shell: bash
        env:
          # main -> production app, staging -> staging app
          COOLIFY_WEBHOOK_URL: ${{ github.event.workflow_run.head_branch == 'staging' && secrets.COOLIFY_STAGING_WEBHOOK_URL || secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -uo pipefail
          if [[ -z "${COOLIFY_WEBHOOK_URL:-}" ]]; then
            echo "Coolify webhook URL secret is not set for ${{ github.event.workflow_run.head_branch }}"; exit 1
          fi
          # Safe to log: scheme, host and path only (no query string, no token)
          echo "Calling: ${COOLIFY_WEBHOOK_URL%%\?*}"
          AUTH=()
          if [[ -n "${COOLIFY_TOKEN:-}" ]]; then AUTH=(-H "Authorization: Bearer ${COOLIFY_TOKEN}"); fi
          CODE=$(curl --silent --show-error --max-time 60 -X POST -o /tmp/resp.txt -w '%{http_code}'             "${AUTH[@]}" "${COOLIFY_WEBHOOK_URL}") || true
          echo "HTTP status: ${CODE}"
          cat /tmp/resp.txt; echo
          if [[ "${CODE}" != 2* ]]; then
            echo "Coolify did not accept the deploy request"; exit 1
          fi
          echo "Deployment triggered"
